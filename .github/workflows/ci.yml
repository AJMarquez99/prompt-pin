name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

# No job-level `name:` — the status-check contexts must be exactly `quality` and
# `ci`, the two checks the main-protection ruleset requires.
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate .

  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin test
