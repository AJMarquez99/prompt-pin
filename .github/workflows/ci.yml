name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

# No job-level `name:` — the status-check contexts must be exactly `quality` and
# `ci`, the two checks the main-protection ruleset requires.
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The native build; the npm package on Linux lacks `claude plugin test`.
      - run: curl -fsSL https://claude.ai/install.sh | bash -s 2.1.300
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: claude plugin validate .

  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The native build; the npm package on Linux lacks `claude plugin test`.
      - run: curl -fsSL https://claude.ai/install.sh | bash -s 2.1.300
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: claude plugin test
