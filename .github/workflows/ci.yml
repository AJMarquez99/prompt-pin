name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

# The Claude Code binary, pinned by version and checked against its checksum from
# downloads.claude.ai/claude-code-releases/<version>/manifest.json (linux-x64).
# Bump both together. The npm package on Linux lacks `claude plugin test`.
env:
  CLAUDE_VERSION: 2.1.300
  CLAUDE_SHA256: 674deba0bba9aee479f4503c438b49303b6fdd304b9a471b14977aaec5215453

# No job-level `name:` — the status-check contexts must be exactly `quality` and
# `ci`, the two checks the main-protection ruleset requires.
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Claude Code
        run: |
          curl -fsSL "https://downloads.claude.ai/claude-code-releases/$CLAUDE_VERSION/linux-x64/claude" -o "$RUNNER_TEMP/claude"
          echo "$CLAUDE_SHA256  $RUNNER_TEMP/claude" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/claude"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: claude plugin validate .

  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Claude Code
        run: |
          curl -fsSL "https://downloads.claude.ai/claude-code-releases/$CLAUDE_VERSION/linux-x64/claude" -o "$RUNNER_TEMP/claude"
          echo "$CLAUDE_SHA256  $RUNNER_TEMP/claude" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/claude"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: claude plugin test
